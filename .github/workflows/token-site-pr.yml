name: token-site non-deploy checks

on:
  pull_request:
    paths:
      - "apps/token-site/**"
      - "docs/accessibility-review-2026-11-09.md"
      - ".github/workflows/token-site-pr.yml"
  push:
    branches:
      - main
    paths:
      - "apps/token-site/**"
      - "docs/accessibility-review-2026-11-09.md"
      - ".github/workflows/token-site-pr.yml"

permissions:
  contents: read

concurrency:
  group: token-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static, browser, keyboard, motion and accessibility validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6.0.0
        with:
          persist-credentials: false

      - name: Check complete test harness availability
        id: harness
        shell: bash
        run: |
          set -euo pipefail
          required=(
            apps/token-site/checks.sh
            apps/token-site/nav-toggle-test.py
            apps/token-site/keyboard-test.py
            apps/token-site/reduced-motion-test.py
            apps/token-site/a11y-review.py
            apps/token-site/cdp_helper.py
            apps/token-site/screenshots.sh
          )
          missing=()
          for path in "${required[@]}"; do
            [[ -f "$path" ]] || missing+=("$path")
          done
          if (( ${#missing[@]} == 0 )); then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Complete token-site test harness is present."
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Post-merge validation is deferred; missing harness files: ${missing[*]}"
          else
            echo "::error::PR validation requires the complete test harness. Missing: ${missing[*]}"
            exit 1
          fi

      - name: Install Chrome
        if: steps.harness.outputs.available == 'true'
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Export Chrome path
        if: steps.harness.outputs.available == 'true'
        run: |
          echo "CHROME=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
          echo "CHROME_VERSION=${{ steps.chrome.outputs.chrome-version }}" >> "$GITHUB_ENV"

      - name: Check required tools
        if: steps.harness.outputs.available == 'true'
        run: |
          set -euo pipefail
          command -v bash
          command -v curl
          command -v file
          command -v node
          command -v python3
          command -v ss
          echo "Chrome: $CHROME_VERSION"

      - name: Static, route, copy, security-pattern, heading and contrast checks
        if: steps.harness.outputs.available == 'true'
        working-directory: apps/token-site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          bash checks.sh 2>&1 | tee evidence/ci-checks.log

      - name: Mobile navigation test (three independent runs)
        if: steps.harness.outputs.available == 'true'
        working-directory: apps/token-site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          for attempt in 1 2 3; do
            echo "NAV-TOGGLE RUN ${attempt}/3"
            python3 nav-toggle-test.py 2>&1 | tee "evidence/ci-nav-${attempt}.log"
          done

      - name: Keyboard-only interaction matrix (all six pages)
        if: steps.harness.outputs.available == 'true'
        working-directory: apps/token-site
        shell: bash
        run: |
          set -euo pipefail
          python3 keyboard-test.py 2>&1 | tee evidence/ci-keyboard.log

      - name: Reduced-motion browser emulation
        if: steps.harness.outputs.available == 'true'
        working-directory: apps/token-site
        shell: bash
        run: |
          set -euo pipefail
          python3 reduced-motion-test.py 2>&1 | tee evidence/ci-reduced-motion.log

      - name: Accessibility review (static + computed contrast)
        if: steps.harness.outputs.available == 'true'
        working-directory: apps/token-site
        shell: bash
        run: |
          set -euo pipefail
          python3 a11y-review.py 2>&1 | tee evidence/ci-a11y-review.log

      - name: Refresh and validate desktop/mobile screenshots
        if: steps.harness.outputs.available == 'true'
        working-directory: apps/token-site
        shell: bash
        run: |
          set -euo pipefail
          bash screenshots.sh 2>&1 | tee evidence/ci-screenshots.log

      - name: Generate evidence checksums
        if: always() && steps.harness.outputs.available == 'true'
        working-directory: apps/token-site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          find evidence -maxdepth 1 -type f \( -name '*.png' -o -name '*.log' \) -print0 | sort -z | xargs -0 -r sha256sum > CI-SHA256SUMS.txt
          sha256sum checks.sh screenshots.sh nav-toggle-test.py keyboard-test.py reduced-motion-test.py a11y-review.py cdp_helper.py >> CI-SHA256SUMS.txt

      - name: Upload complete CI evidence
        if: always() && steps.harness.outputs.available == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # actions/upload-artifact v6.0.0
        with:
          name: token-site-evidence-${{ github.run_id }}
          path: |
            apps/token-site/evidence/*.png
            apps/token-site/evidence/*.log
            apps/token-site/CI-SHA256SUMS.txt
            apps/token-site/checks.sh
            apps/token-site/screenshots.sh
            apps/token-site/nav-toggle-test.py
            apps/token-site/keyboard-test.py
            apps/token-site/reduced-motion-test.py
            apps/token-site/a11y-review.py
            apps/token-site/cdp_helper.py
            docs/accessibility-review-2026-11-09.md
          if-no-files-found: error
          retention-days: 14
