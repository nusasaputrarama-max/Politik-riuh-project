name: token-site non-deploy checks

on:
  pull_request:
    paths:
      - "apps/token-site/**"
      - ".github/workflows/token-site-pr.yml"
  push:
    branches:
      - main
    paths:
      - "apps/token-site/**"
      - ".github/workflows/token-site-pr.yml"

permissions:
  contents: read

concurrency:
  group: token-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static, browser and screenshot validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6.0.0
        with:
          persist-credentials: false

      - name: Check test harness availability
        id: harness
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f apps/token-site/checks.sh && -f apps/token-site/nav-toggle-test.py && -f apps/token-site/screenshots.sh ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "All required token-site test scripts are present."
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Post-merge validation is deferred until the PR-013 test harness is merged."
          else
            echo "::error::PR validation requires checks.sh, nav-toggle-test.py, and screenshots.sh."
            exit 1
          fi

      - name: Install Chrome
        if: steps.harness.outputs.available == 'true'
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Export Chrome path
        if: steps.harness.outputs.available == 'true'
        run: |
          echo "CHROME=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
          echo "CHROME_VERSION=${{ steps.chrome.outputs.chrome-version }}" >> "$GITHUB_ENV"

      - name: Check required tools
        if: steps.harness.outputs.available == 'true'
        run: |
          command -v bash
          command -v curl
          command -v file
          command -v node
          command -v python3
          command -v ss
          echo "Chrome: $CHROME_VERSION"

      - name: Static, route, copy, security-pattern, heading and contrast checks
        if: steps.harness.outputs.available == 'true'
        working-directory: apps/token-site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          bash checks.sh 2>&1 | tee evidence/ci-checks.log

      - name: Mobile navigation test (three independent runs)
        if: steps.harness.outputs.available == 'true'
        working-directory: apps/token-site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          for attempt in 1 2 3; do
            echo "NAV-TOGGLE RUN ${attempt}/3"
            python3 nav-toggle-test.py 2>&1 | tee "evidence/ci-nav-${attempt}.log"
          done

      - name: Refresh and validate desktop/mobile screenshots
        if: steps.harness.outputs.available == 'true'
        working-directory: apps/token-site
        shell: bash
        run: |
          set -euo pipefail
          bash screenshots.sh 2>&1 | tee evidence/ci-screenshots.log

      - name: Generate evidence checksums
        if: always() && steps.harness.outputs.available == 'true'
        working-directory: apps/token-site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          find evidence -maxdepth 1 -type f \( -name '*.png' -o -name 'ci-*.log' \) -print0 | sort -z | xargs -0 -r sha256sum > CI-SHA256SUMS.txt
          sha256sum checks.sh screenshots.sh nav-toggle-test.py >> CI-SHA256SUMS.txt

      - name: Upload CI evidence (screenshots, logs, SHA-256)
        if: always() && steps.harness.outputs.available == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # actions/upload-artifact v6.0.0
        with:
          name: token-site-evidence-${{ github.run_id }}
          path: |
            apps/token-site/evidence/*.png
            apps/token-site/evidence/ci-*.log
            apps/token-site/CI-SHA256SUMS.txt
            apps/token-site/checks.sh
            apps/token-site/screenshots.sh
            apps/token-site/nav-toggle-test.py
          if-no-files-found: warn
          retention-days: 14
